<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Key Account Health Dashboard</title>
<meta name="description" content="A free, private tool for key account managers. See which accounts need you today, why, and what to do. Export Excel (Power BI ready) and PowerPoint in one click. Your data never leaves your browser.">
<style>
:root{
  --bg:#f4f6f9;--panel:#fff;--panel2:#eef2f6;--text:#16202c;--muted:#5d6a79;--line:#dde3ea;
  --brand:#0b6b57;--brandSoft:#e2f2ec;
  --good:#1f8a4c;--goodSoft:#e1f3e8;--warn:#b7791f;--warnSoft:#fbf0db;--bad:#c0392b;--badSoft:#fbe4e1;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 2px 6px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141a;--panel:#171e26;--panel2:#1e2731;--text:#e6edf3;--muted:#9aa8b6;--line:#2b3644;
  --brand:#2bb594;--brandSoft:#13392f;--good:#3ccf7a;--goodSoft:#133323;--warn:#e8b04b;--warnSoft:#3a2e14;--bad:#ff6b5b;--badSoft:#3d1a16;--shadow:none}}
:root[data-theme="dark"]{
  --bg:#0f141a;--panel:#171e26;--panel2:#1e2731;--text:#e6edf3;--muted:#9aa8b6;--line:#2b3644;
  --brand:#2bb594;--brandSoft:#13392f;--good:#3ccf7a;--goodSoft:#133323;--warn:#e8b04b;--warnSoft:#3a2e14;--bad:#ff6b5b;--badSoft:#3d1a16;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;font-size:15px;line-height:1.55}
a{color:var(--brand)}
button{font:inherit;cursor:pointer}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:1.12rem;cursor:pointer}
.logo i{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-style:normal}
.by{font-size:.84rem;color:var(--muted)}
.by a{font-weight:600;text-decoration:none}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;padding:8px 13px;font-size:.88rem}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.btn.sm{padding:4px 10px;font-size:.8rem}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.privacy{background:var(--brandSoft);padding:8px 20px;font-size:.85rem;border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
main{max-width:1100px;margin:0 auto;padding:22px 20px 40px}
h1{font-size:1.45rem;margin:0}
h2{font-size:1.05rem;margin:0 0 10px}
.sub{color:var(--muted);margin:2px 0 18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}
.kpi .l{font-size:.8rem;color:var(--muted)}
.kpi .v{font-size:1.45rem;font-weight:700}
.acc{cursor:pointer;border-inline-start:6px solid var(--muted);transition:transform .1s}
.acc:hover{transform:translateY(-2px)}
.acc.good{border-inline-start-color:var(--good)}.acc.warn{border-inline-start-color:var(--warn)}.acc.bad{border-inline-start-color:var(--bad)}
.acc .nm{font-weight:700;font-size:1.02rem}
.acc .meta{font-size:.82rem;color:var(--muted)}
.acc .why{font-size:.86rem;margin-top:8px}
.score{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:50%;font-weight:700;border:3px solid;flex:0 0 auto}
.big{width:92px;height:92px;font-size:1.8rem;border-width:6px}
.s-good{border-color:var(--good);color:var(--good)}.s-warn{border-color:var(--warn);color:var(--warn)}.s-bad{border-color:var(--bad);color:var(--bad)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:600}
.p-good{background:var(--goodSoft);color:var(--good)}.p-warn{background:var(--warnSoft);color:var(--warn)}.p-bad{background:var(--badSoft);color:var(--bad)}.p-mut{background:var(--panel2);color:var(--muted)}
.today{background:var(--badSoft);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:16px}
.today b{color:var(--bad)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.list li:last-child{border-bottom:0}
.ic{flex:0 0 22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:.8rem;font-weight:700}
.ic.good{background:var(--goodSoft);color:var(--good)}.ic.bad{background:var(--badSoft);color:var(--bad)}.ic.warn{background:var(--warnSoft);color:var(--warn)}.ic.info{background:var(--brandSoft);color:var(--brand)}
.bar{height:9px;border-radius:9px;background:var(--panel2);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:9px}
.fac{display:grid;grid-template-columns:130px 1fr 34px;gap:10px;align-items:center;font-size:.86rem;margin:7px 0}
.msg{background:var(--panel2);border-radius:10px;padding:12px;white-space:pre-wrap;font-size:.92rem}
.action{background:var(--brandSoft);border-radius:10px;padding:12px 14px;font-weight:600}
.tm{display:flex;gap:16px;align-items:center}
textarea,input,select{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%}
textarea{min-height:140px;resize:vertical}
label.f{display:block;font-size:.8rem;color:var(--muted);margin:10px 0 4px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.q{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--panel);color:var(--text);padding:5px 11px;font-size:.82rem}
.seg button.on{background:var(--brand);color:#fff}
details{margin-top:12px}summary{cursor:pointer;color:var(--muted);font-size:.86rem}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;justify-content:center;align-items:flex-start;padding:28px 12px;overflow:auto;z-index:60}
.modal.on{display:flex}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:620px;width:100%;padding:20px}
.person{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.empty{text-align:center;color:var(--muted);padding:34px}
.muted{color:var(--muted)}.small{font-size:.82rem}
footer{text-align:center;color:var(--muted);font-size:.83rem;padding:18px;border-top:1px solid var(--line)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:.88rem;display:none;z-index:80}
@media (max-width:820px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g2,.f2{grid-template-columns:1fr}
  main{padding:16px}header,.privacy{padding-left:16px;padding-right:16px}
  .fac{grid-template-columns:105px 1fr 30px}
}
</style>
</head>

const AD={'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'};
function parseConv(raw){
  const text=String(raw||'').replace(/\r/g,'').replace(/[‎‏‪-‮]/g,'').replace(/[٠-٩]/g,c=>AD[c]);
  const reWA=/^\[?(\d{1,4})[\/.\-](\d{1,2})[\/.\-](\d{1,4})[,،]?\s+(\d{1,2}):(\d{2})(?::\d{2})?\s*([AaPp]\.?[Mm]\.?|ص|م)?\]?\s*(?:[-–]\s*)?([^:]{1,60}?):\s?(.*)$/;
  const reNamed=/^([A-Za-z؀-ۿ][^:]{0,40}):\s(.+)$/;
  const msgs=[];let mode=null;
  for(const ln of text.split('\n')){
    const m=ln.match(reWA);
    if(m){let a=+m[1],b=+m[2],c=+m[3],y,mo,d;const us=/^[ap]/i.test(m[6]||'');
      if(a>31){y=a;mo=b;d=c}else{y=c<100?2000+c:c;if(a>12){d=a;mo=b}else if(b>12){mo=a;d=b}else if(us){mo=a;d=b}else{d=a;mo=b}}
      let hh=+m[4];const ap=(m[6]||'').toLowerCase();if((ap.startsWith('p')||ap==='م')&&hh<12)hh+=12;if((ap.startsWith('a')||ap==='ص')&&hh===12)hh=0;
      msgs.push({who:m[7].trim(),t:new Date(y,mo-1,d,hh,+m[5]).getTime(),txt:m[8]||''});mode='wa';continue}
    if(mode!=='wa'){const n=ln.match(reNamed);if(n&&!/^(https?|from|to|cc|subject|date|sent)$/i.test(n[1].trim())){msgs.push({who:n[1].trim(),t:null,txt:n[2]});mode='named';continue}}
    if(msgs.length&&ln.trim())msgs[msgs.length-1].txt+='\n'+ln;else if(!msgs.length&&ln.trim()){msgs.push({who:'?',t:null,txt:ln});mode='blob'}
  }
  return msgs.filter(m=>!/<Media omitted>|تم استبعاد الوسائط|This message was deleted/i.test(m.txt));
}

function analyzeConv(raw,me){

  const timed=msgs.filter(m=>m.t);

  let trend=0;if(rts.length>=4){const h=Math.floor(rts.length/2),a=rts.slice(0,h).reduce((s,x)=>s+x,0)/h,b=rts.slice(h).reduce((s,x)=>s+x,0)/(rts.length-h);if(b<a*.7)trend=1;else if(b>a*1.4)trend=-1}

  return {score:Math.round(clamp(score)),sigs:sigs.map(s=>s.k),trend,unans,late,lastClientDate:lastClient?iso(lastClient.t):null,count:msgs.length,me,parts};
}

    if(a.conv.trend<0)out.push({k:'bad',w:7,txt:t('sig_slow')});if(a.conv.trend>0)out.push({k:'good',w:4,txt:t('sig_fast')});
    if(a.conv.unans>=2)out.push({k:'bad',w:8,txt:t('sig_unans',{n:a.conv.unans})});if(a.conv.late)out.push({k:'good',w:3,txt:t('sig_late')})}
  if(num(a.sla)!=null&&num(a.sla)<95)out.push({k:'warn',w:6,txt:t('r_slaLow',{v:num(a.sla)})});
  if(num(a.payDays)!=null&&num(a.payDays)>60)out.push({k:'warn',w:5,txt:t('r_payLate',{v:DN(num(a.payDays))})});
  if(num(a.growth)!=null&&num(a.growth)<0)out.push({k:'warn',w:5,txt:t('r_growthDown',{v:Math.abs(num(a.growth))})});
  if(num(a.growth)!=null&&num(a.growth)>=10)out.push({k:'good',w:3,txt:t('r_growthUp',{v:num(a.growth)})});

function nextAction(a){

function medScore(a){const m=a.med||{};const ks=MDK.filter(k=>m[k]!=null&&m[k]!=='');if(!ks.length)return null;return Math.round(MDK.reduce((s,k)=>s+(Number(m[k])||0),0)/16*100)}
function matrixSVG(L,big){
  const W=640,H=big?380:340,pad=46,x=v=>pad+(W-pad-14)*v/100,y=v=>H-pad-(H-pad-14)*v/100;
  const mx=Math.max(1,...L.map(a=>Number(a.value)||0));
  const qz=[['star',0,50],['strategic',50,50],['streamline',0,0],['status',50,0]];
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" direction="ltr" style="direction:ltr;max-height:${H}px;font-family:Segoe UI,Tahoma,sans-serif;font-size:11px" role="img">`;
  qz.forEach(([k,qx,qy])=>{s+=`<rect x="${x(qx)}" y="${y(qy+50)}" width="${x(50)-x(0)}" height="${y(0)-y(50)}" fill="var(--${QD[k].c==='mut'?'panel2':QD[k].c+'Soft'})" opacity=".55"/><text x="${x(qx)+8}" y="${y(qy+50)+16}" fill="var(--muted)" font-weight="700">${esc(qName(k))}</text>`});
  s+=`<line x1="${x(50)}" y1="${y(0)}" x2="${x(50)}" y2="${y(100)}" stroke="var(--line)"/><line x1="${x(0)}" y1="${y(50)}" x2="${x(100)}" y2="${y(50)}" stroke="var(--line)"/>`;
  s+=`<text x="${(x(0)+x(100))/2}" y="${H-10}" text-anchor="middle" fill="var(--muted)">${esc(t('axX'))} →</text><text x="14" y="${(y(0)+y(100))/2}" text-anchor="middle" fill="var(--muted)" transform="rotate(-90 14 ${(y(0)+y(100))/2})">${esc(t('axY'))} →</text>`;
  L.forEach(a=>{const h=health(a),at=attractiveness(a),r=4+12*Math.sqrt((Number(a.value)||0)/mx);s+=`<circle data-a="open" data-id="${a.id}" cx="${x(h)}" cy="${y(at)}" r="${r.toFixed(1)}" fill="var(--${band(h)})" fill-opacity=".72" stroke="var(--panel)" stroke-width="1.5" style="cursor:pointer"><title>${esc(a.name)} · ${t('health')} ${h} · ${money(a.value)}</title></circle>`});
  return s+'</svg>';
}

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

  for(const f of files){

    const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,tm,true);h.setUint16(12,dt,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,name.length,true);h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),name,data);
    const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,tm,true);c.setUint16(14,dt,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);c.setUint16(30,0,true);c.setUint16(32,0,true);c.setUint16(34,0,true);c.setUint16(36,0,true);c.setUint32(38,0,true);c.setUint32(42,off,true);

    if(g('email')!==undefined&&g('email')!=='')a.email=String(g('email')).trim();
    if(g('sector')!==undefined&&g('sector')!=='')a.sector=String(g('sector')).trim();
    if(g('value')!==undefined&&toNum(g('value'))!=null)a.value=toNum(g('value'));
    ['renewal','lastContact'].forEach(f=>{const v=g(f);if(v!==undefined&&toDate(v))a[f]=toDate(v)});
    ['q1','q2','q3'].forEach(f=>{const v=g(f);if(v!==undefined&&v!=='')a[f]=toYN(v)});
    ['sla','payDays','growth'].forEach(f=>{const v=g(f);if(v!==undefined&&toNum(v)!=null){let n=toNum(v);if(f!=='payDays'&&Math.abs(n)<=1&&String(v).indexOf('%')<0&&typeof v==='number'&&n!==0)n=Math.round(n*1000)/10;a[f]=n}});
    a.extra=a.extra||{};m.forEach((f,i)=>{if(f==='extra'&&IMP.headers[i]&&r[i]!==''&&r[i]!=null){let v=r[i];if(typeof v==='number'&&/date|تاريخ/i.test(IMP.headers[i])&&toDate(v))v=toDate(v);a.extra[IMP.headers[i]]=v}});
    if(isNew){DB.accounts.push(a);byName[name.toLowerCase()]=a;added++}else upd++;
  }
  save();closeM();VIEW={name:'home'};HF={q:'',f:'all',n:60};render();toast(t('impDone',{n:added,u:upd})+(skip?' '+t('impSkip',{s:skip}):''));
}
function buildTemplate(){
  const L=FLAB();const hdr=[L.name,L.contact,L.sector,L.value,L.renewal,L.lastContact,L.q1,L.q2,L.q3,L.sla,L.payDays,L.growth];
  const ex=AR()?['شركة المثال','أحمد','تجزئة',{n:1500000},{d:offs(120)},{d:offs(-10)},'نعم','نعم','لا',96,45,8]:['Example Co.','Ahmed','Retail',{n:1500000},{d:offs(120)},{d:offs(-10)},'Yes','Yes','No',96,45,8];
  const sx=sheetXml([hdr,ex],[24,18,14,18,14,14,26,26,22,14,14,14],false,AR());
  return zip([{name:'[Content_Types].xml',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>'},
   {name:'_rels/.rels',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
   {name:'xl/workbook.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${AR()?'الحسابات':'Accounts'}" sheetId="1" r:id="rId1"/></sheets></workbook>`},
   {name:'xl/_rels/workbook.xml.rels',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'},
   {name:'xl/styles.xml',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="yyyy-mm-dd"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/><family val="2"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/><family val="2"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF0B6B57"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="4"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="3" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>'},
   {name:'xl/worksheets/sheet1.xml',data:sx}]);
}

/* ================= EVENTS ================= */
function bind(){
  document.querySelectorAll('[data-a]').forEach(el=>el.onclick=e=>{
    const a=el.dataset.a,id=el.dataset.id;e.preventDefault();e.stopPropagation();
    const acc=DB.accounts.find(x=>x.id===id);
    if(a==='add'){if(DB.accounts.length>=MAXACC){toast(t('limit'));return}accForm()}
    else if(a==='import')importForm();
    else if(a==='sched')schedForm(acc);
    else if(a==='tpl')dl(buildTemplate(),(AR()?'قالب-الحسابات':'accounts-template')+'.xlsx','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    else if(a==='more'){HF.n+=60;refreshGrid()}
    else if(a==='fneed'){HF.f='need';render()}
    else if(a==='demo'){demo();render()}
    else if(a==='open'){VIEW={name:'acc',id};render();scrollTo(0,0)}
    else if(a==='home'){VIEW={name:'home'};render();scrollTo(0,0)}
    else if(a==='edit')accForm(acc);
    else if(a==='del'){if(confirm(t('confirmDel'))){DB.accounts=DB.accounts.filter(x=>x.id!==id);save();VIEW={name:'home'};render()}}
    else if(a==='addP')personForm(acc);
    else if(a==='delP'){const ac=DB.accounts.find(x=>x.id===el.dataset.acc);ac.people=ac.people.filter(p=>p.id!==id);save();render()}
    else if(a==='copy'){const txt=document.getElementById('msgTxt').innerText;const done=()=>{el.textContent=t('copied')};if(navigator.clipboard)navigator.clipboard.writeText(txt).then(done,()=>{fallbackCopy(txt);done()});else{fallbackCopy(txt);done()}}
    else if(a==='conv'){const raw=document.getElementById('convTxt').value;const me=document.getElementById('meSel')?document.getElementById('meSel').value:(acc.conv&&acc.conv.me);acc.convRaw=raw;acc.conv=raw.trim()?analyzeConv(raw,me):null;if(acc.conv&&acc.conv.lastClientDate&&(!acc.lastContact||acc.conv.lastClientDate>acc.lastContact))acc.lastContact=acc.conv.lastClientDate;save();render()}
  });
  document.querySelectorAll('.seg[data-med]').forEach(s=>s.querySelectorAll('button').forEach(b=>b.onclick=()=>{const ac=DB.accounts.find(x=>x.id===s.dataset.id);if(!ac)return;ac.med=ac.med||{};const v=+b.dataset.v;ac.med[s.dataset.med]=(ac.med[s.dataset.med]===v)?null:v;save();const y=scrollY;render();scrollTo(0,y)}));
  const qi=document.getElementById('q');if(qi&&!qi._b){qi._b=1;qi.oninput=()=>{HF.q=qi.value;HF.n=60;refreshGrid()}}
  const fs=document.getElementById('fseg');if(fs)fs.querySelectorAll('button').forEach(b=>b.onclick=()=>{HF.f=b.dataset.f;HF.n=60;fs.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));refreshGrid()});
  const cf=document.getElementById('convFile');if(cf)cf.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{document.getElementById('convTxt').value=r.result};r.readAsText(f)};
}
function fallbackCopy(s){const ta=document.createElement('textarea');ta.value=s;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove()}
document.getElementById('home').onclick=()=>{VIEW={name:'home'};render()};
document.getElementById('howBtn').onclick=()=>{VIEW={name:'how'};render()};
document.getElementById('exportBtn').onclick=exportForm;
document.getElementById('langBtn').onclick=()=>{LANG=AR()?'en':'ar';DB.prefs.lang=LANG;save();render()};
document.getElementById('themeBtn').onclick=()=>{const c=document.documentElement.getAttribute('data-theme');const dark=c?c==='dark':matchMedia('(prefers-color-scheme: dark)').matches;const n=dark?'light':'dark';document.documentElement.setAttribute('data-theme',n);DB.prefs.theme=n;save()};
document.getElementById('demoBtn').onclick=()=>{demo();VIEW={name:'home'};render();toast(t('demoLoaded'))};
document.getElementById('clearBtn').onclick=()=>{if(confirm(t('confirmClear'))){DB={accounts:[],prefs:{lang:LANG,seen:true}};save();VIEW={name:'home'};render()}};
document.getElementById('backupBtn').onclick=()=>dl(new TextEncoder().encode(JSON.stringify({app:'account-pulse',v:2,data:DB},null,2)),'account-pulse-backup-'+iso(new Date())+'.json','application/json');
document.getElementById('restoreFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(j.app!=='account-pulse'||!j.data||!Array.isArray(j.data.accounts))throw 0;DB=j.data;DB.prefs=DB.prefs||{};save();VIEW={name:'home'};render();toast(t('restored'))}catch(x){toast(t('badFile'))}};r.readAsText(f);e.target.value=''};
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeM()};

load();
LANG=DB.prefs.lang||((navigator.language||'').startsWith('ar')?'ar':'en');
if(DB.prefs.theme)document.documentElement.setAttribute('data-theme',DB.prefs.theme);
if(!DB.accounts.length&&!DB.prefs.seen){demo();DB.prefs.seen=true;save()}
render();
</script>
</body>
